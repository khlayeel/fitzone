<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fitnessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#fitnessGrad)"/>
  
  <!-- Treadmill -->
  <rect x="50" y="150" width="120" height="80" rx="8" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.7"/>
  <rect x="55" y="155" width="110" height="50" rx="4" fill="#00d4ff" opacity="0.2"/>
  
  <!-- Barbell -->
  <circle cx="250" cy="120" r="15" fill="#ff3d54" opacity="0.7"/>
  <rect x="200" y="110" width="100" height="20" rx="10" fill="#ff5a6f" opacity="0.6"/>
  <circle cx="350" cy="120" r="15" fill="#ff3d54" opacity="0.7"/>
  
  <!-- Accent elements -->
  <circle cx="350" cy="250" r="25" fill="#4ade80" opacity="0.3"/>
  <path d="M 80 50 Q 100 40 120 50" stroke="#00d4ff" stroke-width="3" fill="none" opacity="0.5"/>
</svg>