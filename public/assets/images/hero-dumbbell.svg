<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3d54;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5a6f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff3d54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e01d35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Dumbbell Left -->
  <rect x="50" y="130" width="30" height="40" rx="15" fill="url(#metalGrad)"/>
  <rect x="60" y="120" width="10" height="60" fill="url(#metalGrad)"/>
  
  <!-- Dumbbell Bar -->
  <rect x="75" y="145" width="250" height="10" rx="5" fill="url(#metalGrad)"/>
  
  <!-- Dumbbell Right -->
  <rect x="320" y="130" width="30" height="40" rx="15" fill="url(#metalGrad)"/>
  <rect x="330" y="120" width="10" height="60" fill="url(#metalGrad)"/>
  
  <!-- Accent line -->
  <line x1="50" y1="280" x2="350" y2="280" stroke="#00d4ff" stroke-width="3" opacity="0.6"/>
</svg>