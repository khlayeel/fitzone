<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="courseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ff3d54;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#courseGrad)"/>
  
  <!-- Person 1 -->
  <circle cx="100" cy="80" r="20" fill="#fbbf24" opacity="0.8"/>
  <rect x="85" y="105" width="30" height="60" rx="5" fill="#fbbf24" opacity="0.7"/>
  
  <!-- Person 2 -->
  <circle cx="200" cy="70" r="22" fill="#ff3d54" opacity="0.8"/>
  <rect x="183" y="98" width="34" height="65" rx="5" fill="#ff3d54" opacity="0.7"/>
  
  <!-- Person 3 -->
  <circle cx="300" cy="80" r="20" fill="#00d4ff" opacity="0.8"/>
  <rect x="285" y="105" width="30" height="60" rx="5" fill="#00d4ff" opacity="0.7"/>
  
  <!-- Connection lines -->
  <line x1="120" y1="165" x2="280" y2="165" stroke="#4ade80" stroke-width="2" opacity="0.5"/>
  
  <!-- Accent -->
  <circle cx="200" cy="250" r="30" fill="#4ade80" opacity="0.2"/>
</svg>