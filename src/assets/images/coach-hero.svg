<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ff3d54;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#coachGrad)"/>
  
  <!-- Head -->
  <circle cx="200" cy="80" r="30" fill="#ff3d54" opacity="0.8"/>
  
  <!-- Body -->
  <rect x="170" y="115" width="60" height="80" rx="10" fill="#ff3d54" opacity="0.7"/>
  
  <!-- Arms -->
  <rect x="100" y="130" width="70" height="15" rx="7" fill="#ff3d54" opacity="0.7" transform="rotate(-20 135 137)"/>
  <rect x="230" y="130" width="70" height="15" rx="7" fill="#ff3d54" opacity="0.7" transform="rotate(20 265 137)"/>
  
  <!-- Legs -->
  <rect x="175" y="200" width="16" height="70" rx="8" fill="#00d4ff" opacity="0.6"/>
  <rect x="209" y="200" width="16" height="70" rx="8" fill="#00d4ff" opacity="0.6"/>
  
  <!-- Accent shapes -->
  <circle cx="80" cy="100" r="20" fill="#00d4ff" opacity="0.3"/>
  <circle cx="320" cy="200" r="30" fill="#ff3d54" opacity="0.2"/>
</svg>